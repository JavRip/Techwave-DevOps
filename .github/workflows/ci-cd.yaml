# ci-cd.yaml
# Pipeline CI/CD para TechWave Solutions
# Se ejecuta en cada push a main o pull request contra main

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/techwave-app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # JOB 1: Tests y validación del código
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Ejecutar tests
        run: |
          cd app
          python -m pytest test_app.py -v

      - name: Validar sintaxis Python
        run: |
          python -m py_compile app/techwave_app.py
          echo "[OK] Sintaxis Python correcta"

  # ============================================================
  # JOB 2: Build y Push de la imagen Docker
  # Sólo se ejecuta en push a main, no en pull requests
  # ============================================================
  build-push:
    name: Build y Push imagen Docker
    runs-on: ubuntu-latest
    needs: test  # Solo ejecuta si los tests pasan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata para tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Obtener SHA corto
        run: 
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Actualizar tags de deployments y commit
        run: |
          sed -i "s/techwave-app:.*/techwave-app:${{ env.SHORT_SHA }}/g" ./kubernetes/deployment-blue.yaml
          sed -i "s/techwave-app:.*/techwave-app:${{ env.SHORT_SHA }}/g" ./kubernetes/deployment-green.yaml
          git config user.name "githubactions-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add ./kubernetes/deployment-blue.yaml
          git add ./kubernetes/deployment-green.yaml
          git commit -m "Tags de deployments actualizados [skip ci]"
          git push
                
      - name: Resumen del build
        run: |
          echo "[OK] Imagen publicada:"
          echo "${{ steps.meta.outputs.tags }}"

  # ============================================================
  # JOB 3: Validación de manifiestos de Kubernetes
  # ============================================================
  validate-k8s:
    name: Validar manifiestos Kubernetes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin

      - name: Validar manifiestos YAML
        run: |
          kubeconform -strict kubernetes/deployment-blue.yaml
          kubeconform -strict kubernetes/deployment-green.yaml
          kubeconform -strict kubernetes/service-blue-green.yaml
          kubeconform -strict kubernetes/ingress.yaml
          kubeconform -strict kubernetes/secret.yaml
          echo "[OK] Todos los manifiestos son válidos"